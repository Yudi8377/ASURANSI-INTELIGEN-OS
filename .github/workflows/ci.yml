name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --check server/src/index.mjs
      - run: node --check server/src/operations.mjs
      - run: node --check server/scripts/bootstrap-admin.mjs
      - run: npm install --prefix server
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p apps/android assembleDebug
