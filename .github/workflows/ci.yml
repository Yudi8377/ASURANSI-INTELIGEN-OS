name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Neon Functions deployment policy
        env:
          AUTH_ACCESS_TOKEN_SECRET: ci-only-placeholder-secret-not-for-deployment
          APP_ORIGIN: https://example.invalid
        run: |
          node --experimental-strip-types --input-type=module -e "
            import assert from 'node:assert/strict';
            const { default: config } = await import('./neon.ts');
            assert.ok(config.functions?.asuransiapi, 'asuransiapi function must be declared');
            assert.equal(config.functions.asuransiapi.source, 'server/src/neon-function.mjs');
            assert.ok(config.functions.asuransiapi.externalPackages?.includes('argon2'), 'argon2 must remain external for native packaging');
            assert.equal(typeof config.branch, 'function', 'per-branch runtime policy must be configured');
          "
      - run: npm run build
      - run: node --check server/src/index.mjs
      - run: node --check server/src/neon-function.mjs
      - run: node --check server/src/neon-fetch-adapter.mjs
      - run: node --check server/src/operations.mjs
      - run: node --check server/src/scenarios.mjs
      - run: node --check server/scripts/bootstrap-admin.mjs
      - run: npm install --prefix server
      - run: node --test server/test/*.test.mjs
  mfa-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mfa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mfa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix server
      - name: Exercise recovery-code race against real PostgreSQL
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/mfa_test
        run: node --test server/test/mfa-recovery.postgres.test.mjs
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p apps/android assembleDebug
  neon-function-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build and smoke-test Linux ARM64 package
        run: bash server/scripts/package-neon-function.sh
      - uses: actions/upload-artifact@v4
        with:
          name: neon-function-package
          path: build/asuransiapi.zip
          if-no-files-found: error
          retention-days: 3
